name: ArkOS4Clone Build and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      arkos_image:
        description: 'Build ArkOS4Clone full image'
        required: false
        type: boolean
        default: true
      darkos_image:
        description: 'Build dArkOS4Clone full image'
        required: false
        type: boolean
        default: false
      arkos_ota:
        description: 'Build ArkOS4Clone console OTA bundle (update-arkos.tar.gz)'
        required: false
        type: boolean
        default: true
      darkos_ota:
        description: 'Build dArkOS4Clone console OTA bundle (update-darkos.tar.gz)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: arkos4clone-release
  cancel-in-progress: false

jobs:
  guard:
    name: Check build targets and prepare release
    runs-on: ubuntu-24.04
    env:
      ARKOS_IMAGE: ${{ github.event_name == 'push' && 'true' || inputs.arkos_image }}
      DARKOS_IMAGE: ${{ github.event_name == 'push' && 'false' || inputs.darkos_image }}
      ARKOS_OTA: ${{ github.event_name == 'push' && 'false' || inputs.arkos_ota }}
      DARKOS_OTA: ${{ github.event_name == 'push' && 'false' || inputs.darkos_ota }}
    outputs:
      build_date: ${{ steps.date.outputs.build_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Require at least one target
        run: |
          if [[ "$ARKOS_IMAGE" != "true" \
             && "$DARKOS_IMAGE" != "true" \
             && "$ARKOS_OTA" != "true" \
             && "$DARKOS_OTA" != "true" ]]; then
            echo "::error::No build target selected"
            exit 1
          fi
          echo "Build targets: image ArkOS=$ARKOS_IMAGE dArkOS=$DARKOS_IMAGE | OTA ArkOS=$ARKOS_OTA dArkOS=$DARKOS_OTA"

      - name: Create draft release
        id: date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          # If the release already exists (re-run on the same day), reuse it and upload with --clobber
          if gh release view "$BUILD_DATE" >/dev/null 2>&1; then
              echo "Release $BUILD_DATE already exists, reusing"
          else
              gh release create "$BUILD_DATE" \
                --title "ArkOS4Clone-$BUILD_DATE" \
                --notes "ArkOS4Clone build artifacts - $BUILD_DATE" \
                --draft=true
          fi

  arkos-image:
    name: ArkOS4Clone full image
    if: github.event_name == 'push' || inputs.arkos_image == true
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            parted \
            rsync \
            xz-utils \
            wget \
            unzip \
            golang-go \
            exfat-fuse \
            exfatprogs \
            e2fsprogs \
            dosfstools \
            btrfs-progs \
            f2fs-tools \
            p7zip-full

      - name: Download & extract source image
        run: |
          BASE_URL="https://github.com/lcdyk0517/baidupan2release/releases/download/backup-r3xs/ArkOS_R35S-R36S_v2.0_11072025_MultiPanel.img.xz.7z"
          FILENAME=$(basename "$BASE_URL")

          echo "=== Downloading split parts ==="
          for i in 001 002; do
            echo "Downloading part $i ..."
            wget --progress=bar:force:noscroll "${BASE_URL}.${i}" && echo "part $i done" || { echo "Failed to download part $i"; exit 1; }
          done

          echo "=== Extracting 7z parts ==="
          7z x "${FILENAME}.001" -o. -y

          echo "=== Locating and extracting xz ==="
          ls -lh *.7z* *.xz 2>/dev/null || true
          XZ_FILE=$(ls *.xz 2>/dev/null | head -1)
          if [ -z "$XZ_FILE" ]; then
            echo "ERROR: No .xz file found after 7z extraction"
            exit 1
          fi
          echo "Extracting $XZ_FILE ..."
          unxz "$XZ_FILE"

          echo "=== Removing intermediate files to free space ==="
          rm -f *.7z.001 *.7z.002

          echo "=== Verifying img ==="
          IMG_FILE=$(ls *.img 2>/dev/null | head -1)

          if [ -z "$IMG_FILE" ]; then
            echo "ERROR: No .img file found"
            exit 1
          fi

          echo "Source image: $IMG_FILE ($(du -h "$IMG_FILE" | cut -f1))"

      - name: Build image
        run: |
          chmod +x build_image.sh scripts/repart_image.sh scripts/mount_arkos.sh scripts/clone_support.sh scripts/build_dtb_selector.sh uboot/flash_uboot.sh
          mkdir -p mnt
          sudo ./build_image.sh $(ls *.img) . --ci

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DATE: ${{ needs.guard.outputs.build_date }}
        run: |
          XZ_FILE=$(ls *.img.xz 2>/dev/null | head -1)
          if [ -z "$XZ_FILE" ]; then
            echo "ERROR: No .img.xz found"
            exit 1
          fi
          echo "Uploading: $XZ_FILE"
          gh release upload "$BUILD_DATE" "$XZ_FILE" --clobber

  darkos-image:
    name: dArkOS4Clone full image
    if: github.event_name != 'push' && inputs.darkos_image == true
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            parted \
            rsync \
            xz-utils \
            wget \
            unzip \
            golang-go \
            exfat-fuse \
            exfatprogs \
            e2fsprogs \
            dosfstools \
            btrfs-progs \
            f2fs-tools \
            p7zip-full

      - name: Download & extract source image
        run: |
          echo "=== Fetching latest dArkOS release info ==="
          RELEASE_JSON=$(curl -fsSL https://api.github.com/repos/christianhaitian/dArkOS/releases/latest)
          TAG_NAME=$(echo "$RELEASE_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          echo "Latest release tag: $TAG_NAME"

          echo "=== Looking for G350 assets ==="
          ASSETS=$(echo "$RELEASE_JSON" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assets = [a['browser_download_url'] for a in data.get('assets', []) if 'G350' in a['name'] and '.7z.' in a['name']]
          assets.sort()
          for a in assets:
              print(a)
          ")
          echo "$ASSETS"

          if [ -z "$ASSETS" ]; then
            echo "ERROR: No assets containing G350 found"
            exit 1
          fi

          echo "=== Downloading split parts ==="
          for url in $ASSETS; do
            echo "Downloading $(basename "$url") ..."
            wget --progress=bar:force:noscroll "$url" || { echo "Failed to download $url"; exit 1; }
          done

          FIRST_PART=$(ls dArkOS_G350*.7z.001 2>/dev/null | head -1)
          if [ -z "$FIRST_PART" ]; then
            echo "ERROR: No .7z.001 file found"
            exit 1
          fi

          echo "=== Extracting 7z parts ==="
          7z x "$FIRST_PART" -o. -y

          echo "=== Removing intermediate files to free space ==="
          rm -f dArkOS_G350*.7z.*

          echo "=== Verifying img ==="
          IMG_FILE=$(ls *.img 2>/dev/null | head -1)
          if [ -z "$IMG_FILE" ]; then
            echo "ERROR: No .img file found"
            exit 1
          fi
          echo "Source image: $IMG_FILE ($(du -h "$IMG_FILE" | cut -f1))"

      - name: Build image
        run: |
          chmod +x build_image.sh scripts/repart_image.sh scripts/mount_arkos.sh scripts/clone_support.sh scripts/build_dtb_selector.sh uboot/flash_uboot.sh
          mkdir -p mnt
          sudo -E ./build_image.sh $(ls *.img) . --ci

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DATE: ${{ needs.guard.outputs.build_date }}
        run: |
          XZ_FILE=$(ls *.img.xz 2>/dev/null | head -1)
          if [ -z "$XZ_FILE" ]; then
            echo "ERROR: No .img.xz found"
            exit 1
          fi
          echo "Uploading: $XZ_FILE"
          gh release upload "$BUILD_DATE" "$XZ_FILE" --clobber

  ota-arkos:
    name: ArkOS4Clone OTA bundle
    if: github.event_name != 'push' && inputs.arkos_ota == true
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build update-arkos.tar
        run: |
          chmod +x scripts/build_update_tar.sh
          sudo ./scripts/build_update_tar.sh

      - name: Prepare firstboot.sh
        run: |
          cp boot/dArkOS/clone.sh firstboot.sh

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DATE: ${{ needs.guard.outputs.build_date }}
        run: |
          [ -f update-arkos.tar ] || { echo "ERROR: update-arkos.tar is missing"; exit 1; }
          gh release upload "$BUILD_DATE" update-arkos.tar firstboot.sh --clobber

  ota-darkos:
    name: dArkOS4Clone OTA bundle
    if: github.event_name != 'push' && inputs.darkos_ota == true
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build update-darkos.tar
        run: |
          chmod +x scripts/build_update_tar.sh
          sudo ./scripts/build_update_tar.sh -d
      
      - name: Prepare firstboot.sh
        run: |
          cp boot/dArkOS/clone.sh firstboot.sh

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DATE: ${{ needs.guard.outputs.build_date }}
        run: |
          [ -f update-darkos.tar ] || { echo "ERROR: update-darkos.tar is missing"; exit 1; }
          gh release upload "$BUILD_DATE" update-darkos.tar firstboot.sh --clobber

  publish:
    name: Publish release
    if: always() && needs.guard.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [guard, arkos-image, darkos-image, ota-arkos, ota-darkos]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILD_DATE: ${{ needs.guard.outputs.build_date }}
        run: gh release edit "$BUILD_DATE" --draft=false --latest
