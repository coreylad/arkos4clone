name: Bug Report
description: Report a bug (please make sure you are using the latest version first!)
title: "[Bug]: "
labels: []
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ Important Notice

        **Language**: Issues must be submitted in **English** or **Chinese**. Issues in other languages will be closed immediately.

        ---

        **Boot Issues Troubleshooting**:
        - If black screen after logo: Please change SD card and rewrite the image. If problem persists, connect charger then press reset button to boot.
        - If device worked before but not now: Disconnect battery, reconnect it, then boot.
        - If logo doesn't display: DTB selection is incorrect.
        - If black screen after logo: Most likely insufficient battery power.
        - **DO NOT submit issues for devices that cannot boot at all.**

  - type: checkboxes
    attributes:
      label: Pre-submission checklist
      description: Please confirm before submitting
      options:
        - label: I am using the **latest version** of the project
          required: true
        - label: I have searched existing issues to make sure this is not a duplicate
          required: true
        - label: I have provided a screenshot from the DTB detection tool at https://lcdyk0517.github.io/dtbTools.html
          required: true
        - label: I have described which DTB I selected in the issue
          required: true

  - type: dropdown
    id: firmware
    attributes:
      label: Firmware Type
      description: Which firmware did you flash?
      options:
        - arkos4clone
        - darkos4clone
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Enter the version you are using
      placeholder: e.g.,0913
    validations:
      required: true

  - type: input
    id: dtb
    attributes:
      label: DTB File
      description: Which DTB file are you using? (e.g., R36S Clone -> Type 3 Panel 1)
      placeholder: e.g., R36S Clone -> Type 3 Panel 1
    validations:
      required: true

  - type: textarea
    id: dtb_screenshot
    attributes:
      label: DTB Detection Screenshot
      description: Please provide a screenshot from https://lcdyk0517.github.io/dtbTools.html showing your device's DTB detection result
      placeholder: Drag and drop your screenshot here
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console Output / Error
      description: Paste relevant console output or error messages here
      placeholder: |
        Example:
        Error: Something went wrong at line 42...
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Describe the situation you encountered
      placeholder: A clear and concise description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide detailed steps so we can reproduce the issue
      placeholder: |
        1. Run '...'
        2. Click on '...'
        3. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior (Optional)
      description: What did you expect to happen?
      placeholder: A clear description of the expected behavior.

  - type: textarea
    id: media
    attributes:
      label: Screenshots / Video / Logs (Optional)
      description: Upload screenshots, videos, or additional logs that help explain the issue.
      placeholder: Drag and drop files here or paste logs.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context (Optional)
      description: Add any other context about the problem here.
      placeholder: Related environment details, dependencies, etc.
